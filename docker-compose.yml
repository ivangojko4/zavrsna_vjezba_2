version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: postgres-algebra
    environment:
      POSTGRES_USER: algebra
      POSTGRES_PASSWORD: algebra123
      POSTGRES_DB: algebra_db
    ports:
      - "5433:5432"
    volumes:
      - ./src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql